<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<title>People & P&L</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Концепт: операційний центр людей — світла «папірна» поверхня, щільна сітка метрик, статуси кольором + іконкою + текстом. */
:root{
  --bg:#f3f5f2; --card:#ffffff; --ink:#14201c; --muted:#5a6660; --faint:#8b958f; --line:#dde2dd; --soft:#eef1ed;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --g1:#bcd7f6; --g2:#7fb0ea; --g3:#2a78d6; --g4:#103a74;
  --good:#1b7f55; --warn:#a86b00; --bad:#c93434; --good-bg:#e3f3ea; --warn-bg:#fbf0d9; --bad-bg:#fbe5e2;
  --other:#9aa6b4; --grid:#e6e9e5;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --head:'Manrope','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#101412; --card:#181e1b; --ink:#eceeea; --muted:#a3ada7; --faint:#77817b; --line:#2a312d; --soft:#1f2623;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --g1:#27476f; --g2:#3a6fb3; --g3:#5a9bee; --g4:#b4d3f8;
  --good:#3ab784; --warn:#e0a030; --bad:#ec6a6a; --good-bg:#16302a; --warn-bg:#352c14; --bad-bg:#3a1f1f;
  --other:#6c7a8a; --grid:#242b27;}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101412; --card:#181e1b; --ink:#eceeea; --muted:#a3ada7; --faint:#77817b; --line:#2a312d; --soft:#1f2623;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --g1:#27476f; --g2:#3a6fb3; --g3:#5a9bee; --g4:#b4d3f8;
  --good:#3ab784; --warn:#e0a030; --bad:#ec6a6a; --good-bg:#16302a; --warn-bg:#352c14; --bad-bg:#3a1f1f;
  --other:#6c7a8a; --grid:#242b27;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;padding-block:16px 40px}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em;text-wrap:balance}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:4px}
.hdr{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:14px}
.hdr h1{font-size:22px;font-weight:800}
.hdr .sub{color:var(--muted);font-size:13px;margin-top:2px}
.hdr-r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.pill.on .dot{background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.pill.on .dot{animation:none}}
.sel{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 28px 6px 10px;min-height:34px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-weight:700;font-family:var(--head);cursor:pointer;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;font-weight:600;color:var(--muted);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--s1)}
.reset{border:0;background:transparent;color:var(--s1);cursor:pointer;font-weight:600;padding:6px}
@media (max-width:760px){.bar{position:static}body::before{display:none}}
.grid{display:grid;gap:12px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px;position:relative;min-width:0;display:flex;flex-direction:column;gap:2px}
.t-top{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.t-label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.t-val{font-family:var(--head);font-weight:800;font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.t-val small{font-size:15px;font-weight:700;margin-left:2px;color:var(--muted)}
.t-sub{font-size:12px;color:var(--muted)}
.chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.mute{background:var(--soft);color:var(--muted)}
.delta.good{color:var(--good)}.delta.bad{color:var(--bad)}.delta.mute{color:var(--muted)}.delta{font-weight:700}
.spark{position:relative;height:34px;margin-top:6px}
.spark svg{width:100%;height:34px;display:block}
.spark i{position:absolute;right:-3px;width:7px;height:7px;border-radius:50%;margin-top:-3px;border:2px solid var(--card);background:var(--s1);box-sizing:content-box;margin-right:-2px}
.info{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--faint);color:var(--faint);font-size:10px;font-weight:700;cursor:help;margin-left:4px;vertical-align:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px;min-width:0}
.card h2{font-size:15px;font-weight:800}
.card .cap{color:var(--muted);font-size:12.5px;margin:2px 0 8px}
.card-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.row2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.row3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.row2e{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
@media (max-width:900px){.row2{grid-template-columns:minmax(0,1fr)}}
.chart{width:100%;min-height:120px;position:relative}
.chart svg{display:block;max-width:100%}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font);font-variant-numeric:tabular-nums}
.chart .lbl{fill:var(--ink);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.ln{height:3px;width:14px;border-radius:2px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.4;max-width:280px;box-shadow:0 4px 16px rgba(0,0,0,.25);display:none}
#tip b{font-weight:700}#tip .tr{display:flex;justify-content:space-between;gap:14px}#tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ins li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:13px}
.ins .ic{font-weight:800}
.ins .ic.bad{color:var(--bad)}.ins .ic.warn{color:var(--warn)}.ins .ic.good{color:var(--good)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:320px;overflow:auto}
.feed li{padding:7px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:20px 1fr auto;gap:8px;font-size:13px}
.feed li:first-child{border-top:0}
.feed li.new{animation:fresh 1.6s ease-out}
@keyframes fresh{from{background:color-mix(in srgb,var(--s1) 16%,transparent)}to{background:transparent}}
.feed .s{color:var(--muted);font-size:12px}.feed .ago{color:var(--faint);font-size:11.5px;white-space:nowrap}
.feed .ic{font-weight:800}.ic.exit{color:var(--bad)}.ic.hire{color:var(--good)}.ic.vac{color:var(--s1)}.ic.bench{color:var(--warn)}.ic.proj{color:var(--good)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11.5px;text-align:left;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right}
.tw{overflow-x:auto}
.score{display:inline-block;min-width:34px;text-align:center;font-weight:800;border-radius:6px;padding:1px 6px;font-family:var(--head)}
.score.hi{background:var(--bad-bg);color:var(--bad)}.score.md{background:var(--warn-bg);color:var(--warn)}.score.lo{background:var(--soft);color:var(--muted)}
.heat{display:grid;grid-template-columns:112px repeat(4,minmax(0,1fr));gap:4px;font-size:12px}
.heat .hh{color:var(--muted);font-weight:700;font-size:11.5px;align-self:end;padding:2px 4px}
.heat .rl{align-self:center;font-weight:700;font-size:12px}
.hc{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;background:var(--card);min-height:52px}
.hc b{display:block;font-family:var(--head);font-size:15px;font-variant-numeric:tabular-nums}
.hc span{color:var(--muted);font-size:10.5px}
.hc[aria-pressed="true"]{outline:2px solid var(--ink)}
.hb{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(0,2fr) 42px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.hb .tr{background:var(--soft);border-radius:4px;height:14px;overflow:hidden}.hb .fl{height:100%;border-radius:0 4px 4px 0;background:var(--s1)}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.note{color:var(--muted);font-size:12px}
.sl{display:grid;grid-template-columns:minmax(150px,1fr) minmax(120px,2fr) 70px;gap:8px 12px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.sl:first-of-type{border-top:0}
input[type=range]{width:100%;accent-color:var(--s1)}
.num{width:64px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 6px;text-align:right}
.big{font-family:var(--head);font-weight:800;font-size:26px;letter-spacing:-.02em}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:6px}
.foot{margin-top:24px;color:var(--faint);font-size:12px}
@media (max-width:560px){.sl{grid-template-columns:1fr 70px}.sl input[type=range]{grid-column:1/-1;order:3}.heat{grid-template-columns:70px repeat(4,minmax(0,1fr))}}
@media (min-width:1000px){.t8{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pill.alarm{border-color:var(--bad);color:var(--bad)}
.pill[disabled]{cursor:not-allowed}

</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <div><h1>People &amp; P&amp;L</h1><div class="sub">IT-сервіс · ~800 осіб · синтетичні дані для прототипу · <span id="upd"></span></div></div>
    <div class="hdr-r">
      <button class="pill" id="alerts-btn" aria-label="Відкрити алерти">Алерти</button>
      <button class="pill on" id="live" aria-label="Увімкнути або призупинити живі події"><span class="dot"></span><span id="live-t">Live</span></button>
      <label class="note" for="role">Роль</label>
      <select class="sel" id="role"><option value="hr">HR (повний доступ)</option><option value="dir">Practice Director</option><option value="board">CEO / Board</option><option value="cfo">CFO</option></select>
      <select class="sel" id="dirp" hidden aria-label="Практика директора"></select>
    </div>
  </header>
  <div class="bar">
    <div class="bar-row">
      <div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="executive">Executive</button><button class="tab" role="tab" data-tab="turnover">Відтік</button><button class="tab" role="tab" data-tab="cost">Вартість і P&amp;L</button><button class="tab" role="tab" data-tab="bench">Utilization і Bench</button><button class="tab" role="tab" data-tab="hiring">Найм</button><button class="tab" role="tab" data-tab="people">Люди і ризики</button><button class="tab" role="tab" data-tab="alerts">Алерти і дайджест</button><button class="tab" role="tab" data-tab="data">Дані</button></div>
      <div class="filters">
        <div class="seg" role="group" aria-label="Період"><button data-period="6">6 міс.</button><button data-period="12">12</button><button data-period="24">24</button><button data-period="36">36</button></div>
        <select class="sel" id="f-p" aria-label="Практика"></select><select class="sel" id="f-g" aria-label="Грейд"></select><select class="sel" id="f-l" aria-label="Локація"></select>
        <button class="reset" id="reset" hidden>Скинути фільтри</button>
      </div>
    </div>
  </div>
  <main id="view"></main>
  <p class="foot">Усі дані синтетичні. Формули метрик: tooltip «i» на кожній плитці. * — поточний місяць (MTD, run-rate). Ціль turnover ≤15%, utilization 75%, bench ≤8%; time-to-fill ≤45 дн. і regretted ≤6% — припущення.</p>
</div>
<div id="tip" role="tooltip"></div>
<script>
'use strict';
/* ====== Синтетичні дані та розрахунок метрик ======
   Час у місяцях: 0 = грудень 2022; 47 = листопад 2026; NOW = 10 листопада 2026.
   Показуємо 36 точок: кінець кожного місяця з грудня 2023 до жовтня 2026 + поточний (MTD). */
const PRACTICES = ['Engineering', 'QA', 'Data / AI', 'DevOps / Security'];
const GRADES = ['Jr', 'Mid', 'Sr', 'Lead'];
const LOCS = ['Київ', 'Львів', 'Дніпро', 'Харків', 'Remote (світ)'];
const MONTHS = ['Січ', 'Лют', 'Бер', 'Кві', 'Тра', 'Чер', 'Лип', 'Сер', 'Вер', 'Жов', 'Лис', 'Гру'];
const NOW = 47 + 10 / 30, K = 36, I0 = 12;
const TARGETS = { turnover: 15, turnoverBad: 18, util: 75, bench: 8, benchBad: 11, ttf: 45, regretted: 6 };
const CFG = { repl: { Jr: 0.5, Mid: 0.75, Sr: 1.0, Lead: 1.5 } };
const BASE_SAL = { Jr: 19000, Mid: 33000, Sr: 53000, Lead: 74000 };
const PRAC_SAL = [1.0, 0.88, 1.12, 1.1];
const RATE = { Jr: 28, Mid: 40, Sr: 56, Lead: 72 };
const SKILLS = [
  ['Java', '.NET', 'React', 'Node.js', 'Kotlin / Android', 'Swift / iOS', 'Go'],
  ['Test Automation', 'Performance QA', 'Manual QA', 'SDET'],
  ['Data Engineer', 'ML Engineer', 'Data Analyst', 'MLOps'],
  ['AWS / DevOps', 'Kubernetes', 'Security Engineer', 'SRE']
];
const VOL_REASONS = ['Компенсація', 'Карʼєрний ріст', 'Вигорання / навантаження', 'Відносини з менеджером', 'Релокація / еміграція', 'Інші технології / проєкт', 'Інше'];
const VOL_W = [0.30, 0.20, 0.14, 0.09, 0.08, 0.11, 0.08];
const INV_REASONS = ['Performance', 'Скорочення / реорганізація', 'Завершення контракту'];
const SRC = ['Referral', 'LinkedIn', 'Рекрутингові агенції', 'Career-сайт', 'Boomerang', 'Університети / стажування'];
const SRC_COST = [1500, 2800, null, 900, 500, 1200];
const TEAMS = [32, 14, 11, 11], TEAM_CODE = ['ENG', 'QA', 'DATA', 'OPS'];
const FN = ['Андрій', 'Олег', 'Максим', 'Дмитро', 'Ігор', 'Богдан', 'Тарас', 'Юрій', 'Віктор', 'Назар', 'Олена', 'Марія', 'Наталія', 'Ірина', 'Анна', 'Катерина', 'Оксана', 'Юлія', 'Софія', 'Дарина'];
const LN = ['Коваленко', 'Шевченко', 'Бондаренко', 'Ткаченко', 'Кравчук', 'Мельничук', 'Савчук', 'Лисенко', 'Мороз', 'Петренко', 'Гончаренко', 'Руденко', 'Поліщук', 'Остапенко', 'Яценко', 'Мазур', 'Клименко', 'Кириленко', 'Захарченко', 'Олійник', 'Романюк', 'Тимошенко', 'Павленко', 'Гриценко'];

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pickW(rnd, w) { let s = 0; for (const x of w) s += x; let r = rnd() * s; for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return i; } return w.length - 1; }
const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const startOf = k => I0 + k;
const endOf = k => k < K - 1 ? I0 + k + 1 : NOW;
const ENDS = Array.from({ length: K }, (_, k) => endOf(k));
function monthInfo(i) { const j = 11 + i; return { m: MONTHS[j % 12], y: 2022 + Math.floor(j / 12) }; }
function pointLabel(k) { const q = monthInfo(I0 + k); return q.m + ' ' + String(q.y).slice(2) + (k === K - 1 ? ' (MTD)' : ''); }
const active = (e, t) => e.hire <= t && (e.term == null || e.term > t);

function planAt(t) { return 595 + t / NOW * 225; }
function targetHC(t) { return planAt(t) - Math.max(0, t - 38) * 1.65; }

function hazard(e, t) {
  const ten = t - e.hire;
  let h = 0.0134 * { Jr: 1.05, Mid: 1, Sr: 0.95, Lead: 0.85 }[e.grade] * [1, 1.05, 1.1, 1.05][e.pi];
  h *= ten < 3 ? 0.8 : ten < 12 ? 1.5 : ten < 24 ? 1.1 : ten < 48 ? 0.8 : 0.65;
  if (e.gi >= 2) h *= 1 + 0.95 * smooth((t - 36) / 10) * (e.pi >= 2 ? 1.35 : 1);
  h *= [0.8, 1, 1.2, 1, 0.7, 1][e.si];
  const cal = (11 + Math.floor(t)) % 12;
  h *= (cal <= 2) ? 1.2 : cal === 7 ? 1.1 : 1;
  return h;
}

let _id = 1000;
function makeEmp(rnd, hire, over) {
  const pi = over && over.pi != null ? over.pi : pickW(rnd, [0.47, 0.21, 0.16, 0.16]);
  const gi = over && over.gi != null ? over.gi : pickW(rnd, hire < 0 ? [0.2, 0.38, 0.32, 0.10] : [0.26, 0.40, 0.27, 0.07]);
  const li = over && over.li != null ? over.li : pickW(rnd, [0.38, 0.17, 0.10, 0.07, 0.28]);
  const grade = GRADES[gi];
  const e = {
    id: 'E' + (++_id), name: FN[Math.floor(rnd() * FN.length)] + ' ' + LN[Math.floor(rnd() * LN.length)],
    pi, gi, li, practice: PRACTICES[pi], grade, loc: LOCS[li],
    salary: Math.round(BASE_SAL[grade] * PRAC_SAL[pi] * (0.9 + 0.2 * rnd()) / 100) * 100,
    hire, term: null, termType: null, reason: null, perf: 1 + pickW(rnd, [0.03, 0.12, 0.40, 0.31, 0.14]),
    regretted: false, compa: 0.82 + rnd() * 0.32, raiseM: 2 + rnd() * 28, ot: Math.max(0, Math.round((rnd() * rnd() * 14) * 10) / 10), noVac: Math.floor(rnd() * rnd() * 15),
    bench: new Uint8Array(K), util: new Float32Array(K)

function insights(o, w) {

  const gap = o.turn[k] - TARGETS.turnover;
  out.push([gap > 3 ? 'bad' : gap > 0 ? 'warn' : 'good', gap > 0 ? '▲' : '✓', `Turnover LTM <b>${nf(o.turn[k])}%</b>: ${gap > 0 ? 'вище' : 'нижче'} цілі на ${nf(Math.abs(gap))} п.п., р/р ${o.turn[y] != null ? (o.turn[k] >= o.turn[y] ? '+' : '') + nf(o.turn[k] - o.turn[y]) + ' п.п.' : '—'}.`]);
  let best = null; w.heat.forEach((r, pi) => r.forEach((c, gi) => { if (gi >= 2 && c.rate != null && c.hc >= 12 && (!best || c.rate > best.rate)) best = { ...c, pi, gi }; }));
  if (best) out.push(['bad', '▲', `Найгарячіша зона: <b>${PRACTICES[best.pi]} · ${GRADES[best.gi]}</b>, відтік ${nf(best.rate, 0)}% річних (${best.n} з ${best.hc}).`]);
  const slShare = D.emps.filter(e => match(e, filt()) && e.term != null && e.term > NOW - 12 && e.gi >= 2).reduce((a, e) => a + e.salary * CFG.repl[e.grade], 0) / (o.ltmCost[k] || 1);

  const long = D.emps.filter(e => match(e, filt()) && e.term == null && e.bench[k] && e.bench[k - 1]).length;
  out.push([o.bench[k] > TARGETS.benchBad ? 'bad' : 'warn', '!', `Bench <b>${nf(o.bench[k])}%</b> коштує ${usd(o.benchCost[k])}/міс.; <b>${long}</b> осіб на bench понад місяць.`]);
  out.push([o.ttf[k] > 55 ? 'bad' : 'warn', '!', `Time-to-fill <b>${o.ttf[k] == null ? '—' : Math.round(o.ttf[k])} дн.</b>; ${o.vacOpen[k]} відкритих вакансій недоотримують ~${usd(o.vacLoss[k])} виручки на місяць.`]);
  return `<ul class="ins">${out.map(i => `<li><span class="ic ${i[0]}">${i[1]}</span><span>${i[2]}</span></li>`).join('')}</ul>`;
}

  ['PSA / Jira / Tempo', 'employee_id, month, billable_hours, available_hours, project_end_date', 'щодня', 'потрібен бекенд'],
  ['Finance', 'month, practice, revenue, payroll, overhead', 'щомісяця', 'потрібен бекенд'],
  ['ATS', 'vacancy_id, practice, grade, skill, open_date, close_date, source, candidate_stage', 'щодня', 'потрібен бекенд'],
  ['Опитування eNPS', 'employee_id, quarter, score (0–10)', 'щокварталу', 'потрібен бекенд']
];
const TEMPLATE = 'employee_id,name,practice,grade,location,hire_date,salary,term_date,term_type,term_reason,performance,skill,team,source,utilization,bench\nE-1001,Олена Коваленко,Engineering,Sr,Київ,2021-03-15,56000,,,,4,Java,7,Referral,85,0\nE-1002,Андрій Мороз,QA,Mid,Львів,2022-06-01,31000,2026-08-20,vol,Компенсація,3,Test Automation,3,LinkedIn,80,0\nE-1003,Марія Бондаренко,Data / AI,Lead,Remote (світ),2020-01-10,78000,,,,5,ML Engineer,2,Career-сайт,70,1';
function viewData() {
  const rep = S.report ? `<div class="note" style="margin-top:8px"><b>${S.report.ok ? '✓ Імпортовано' : '▲ Не імпортовано'}.</b> ${S.report.ok ? `${S.report.emps.length} співробітників із ${S.report.total} рядків (активних ${S.report.active}).` : ''}${S.report.errs.length ? '<ul style="margin:6px 0 0;padding-left:18px">' + S.report.errs.slice(0, 6).map(e => `<li>${esc(e)}</li>`).join('') + (S.report.errs.length > 6 ? `<li>…ще ${S.report.errs.length - 6}</li>` : '') + '</ul>' : ''}</div>` : '';
  const rows = CONTRACT.map(c => `<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td>${c[0] === 'HRIS' && !D.synthetic ? chipHtml('good', '✓ ' + esc(D.source.name)) : chipHtml(c[3] === 'CSV-імпорт працює' ? 'warn' : 'mute', c[0] === 'HRIS' ? 'синтетичні · ' + c[3] : 'синтетичні · ' + c[3])}</td></tr>`).join('');
  return `<div class="card"><h2>Джерела даних</h2><div class="cap">Зараз: ${D.synthetic ? 'усі дані синтетичні' : 'співробітники з вашого CSV, решта синтетична'}. Сторінка не може звертатися до зовнішніх API, тому живі підключення потребують невеликого бекенду.</div><div class="tw"><table><tr><th>Джерело</th><th>Поля</th><th>Оновлення</th><th>Статус</th></tr>${rows}</table></div></div>
  <div class="grid row2e" style="margin-top:12px"><div class="card"><h2>Імпорт з HRIS (CSV)</h2><div class="cap">Файл лишається у вашому браузері й нікуди не надсилається. Дати у форматі РРРР-ММ-ДД. Практики й грейди: ${PRACTICES.join(', ')} / ${GRADES.join(', ')}.</div>
  <input type="file" id="csv-file" accept=".csv,.tsv,.txt" style="margin:6px 0"><div class="cap" style="margin-top:6px">або вставте вміст CSV:</div><textarea id="csv-paste" rows="5" style="width:100%;font:12px/1.4 ui-monospace,monospace;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px" placeholder="employee_id,practice,grade,..."></textarea>
  <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="pill" data-act="import-paste">Імпортувати</button><button class="pill" data-act="reset-data" ${D.synthetic ? 'disabled style="opacity:.5"' : ''}>Повернути синтетичні дані</button></div>${rep}
  <div class="note" style="margin-top:8px">Після імпорту live-симуляція вимикається. Utilization і bench беруться з колонок utilization та bench (історії немає, поки не підключено PSA). Опитування й вакансії лишаються синтетичними.</div></div>
  <div class="card"><div class="card-h"><h2>Шаблон CSV</h2><button class="pill" data-act="copy" data-target="tpl">Копіювати</button></div><textarea id="tpl" readonly rows="8" style="width:100%;font:12px/1.4 ui-monospace,monospace;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;white-space:pre">${esc(TEMPLATE)}</textarea>
  <div class="cap" style="margin-top:10px"><b>Шлях до продакшену.</b> Нічний ETL із HRIS, PSA, Finance, ATS у сховище → знімок JSON → цей дашборд. Для персональних даних потрібні SSO і рольовий доступ на сервері, а не лише в інтерфейсі.</div></div></div>`;
}
function applyImport(text, name) {
  const r = importEmployees(text); S.report = r;
  if (r.ok) { D = { emps: r.emps, vacs: D.vacs, synthetic: false, source: { name, rows: r.total, at: Date.now() } }; S.live = false; S.feed = []; }
  render();
}

/* --- рендер --- */
const pby = () => PB || (PB = PRACTICES.map((_, pi) => compute(D, { p: pi, g: S.g, l: S.l })));
function render() {
  PENDING = []; HOV = {}; PB = null;
  O = compute(D, filt());
  const w = windowStats(D, filt(), S.period);
  const html = ({ executive: () => viewExecutive(O, w), turnover: () => viewTurnover(O, w), cost: () => viewCost(O), bench: () => viewBench(O), hiring: () => viewHiring(O), people: () => viewPeople(O), alerts: () => viewAlerts(), data: () => viewData() })[S.tab]();
  $('#view').innerHTML = html;
  drawCharts(); updateBar();
}
function drawCharts() { PENDING.forEach(p => { const el = document.getElementById(p.id); if (el) p.fn(el); }); }
function updateBar() {
  try { const n = computeAlerts(); const b = $('#alerts-btn'); b.textContent = 'Алерти ' + n.length; b.className = 'pill' + (n.some(a => a.sev === 'bad') ? ' alarm' : ''); } catch (e) { }
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === S.tab));
  document.querySelectorAll('[data-period]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.period === S.period));
  $('#f-p').value = S.p; $('#f-g').value = S.g; $('#f-l').value = S.l;
  $('#reset').hidden = S.p < 0 && S.g < 0 && S.l < 0;
  $('#live').classList.toggle('on', S.live); $('#live-t').textContent = S.live ? 'Live' : 'Пауза';
  $('#dirp').hidden = S.role !== 'dir';
  $('#upd').textContent = 'оновлено ' + Math.max(0, Math.round((Date.now() - S.lastUpdate) / 1000)) + ' с тому';
}
function init() {
  const opt = (arr, all) => `<option value="-1">${all}</option>` + arr.map((x, i) => `<option value="${i}">${x}</option>`).join('');
  $('#f-p').innerHTML = opt(PRACTICES, 'Усі практики'); $('#f-g').innerHTML = opt(GRADES, 'Усі грейди'); $('#f-l').innerHTML = opt(LOCS, 'Усі локації'); $('#dirp').innerHTML = PRACTICES.map((x, i) => `<option value="${i}">${x}</option>`).join('');
  $('#f-p').onchange = e => { S.p = +e.target.value; render(); }; $('#f-g').onchange = e => { S.g = +e.target.value; render(); }; $('#f-l').onchange = e => { S.l = +e.target.value; render(); };
  $('#reset').onclick = () => { S.p = S.g = S.l = -1; render(); };
  $('#role').onchange = e => { S.role = e.target.value; render(); }; $('#dirp').onchange = e => { S.dirP = +e.target.value; render(); };
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { S.tab = t.dataset.tab; location.hash = S.tab; render(); });
  document.querySelectorAll('[data-period]').forEach(b => b.onclick = () => { S.period = +b.dataset.period; render(); });
  $('#live').onclick = () => { S.live = !S.live; updateBar(); };
  $('#alerts-btn').onclick = () => { S.tab = 'alerts'; location.hash = 'alerts'; render(); };
  $('#view').addEventListener('change', e => { if (e.target.id === 'csv-file' && e.target.files[0]) { const f = e.target.files[0], rd = new FileReader(); rd.onload = () => applyImport(String(rd.result), f.name); rd.readAsText(f); } });
  $('#view').addEventListener('click', e => {
    const go = e.target.closest('[data-go]'); if (go) { e.preventDefault(); S.tab = go.dataset.go; location.hash = S.tab; render(); return; }
    const ac = e.target.closest('[data-act]');
    if (ac) {
      const a = ac.dataset.act;
      if (a === 'copy') { const t = document.getElementById(ac.dataset.target); t.select(); try { navigator.clipboard.writeText(t.value).then(() => { ac.textContent = 'Скопійовано'; }, () => { ac.textContent = 'Виділено, натисніть Ctrl+C'; }); } catch (er) { ac.textContent = 'Виділено, натисніть Ctrl+C'; } }
      else if (a === 'import-paste') { const v = document.getElementById('csv-paste').value; if (v.trim()) applyImport(v, 'вставлений CSV'); }
      else if (a === 'reset-data') { D = generate(7); S.report = null; S.live = true; render(); }
      return;
    }
    const h = e.target.closest('[data-heat]'); if (h) { const [p, g] = h.dataset.heat.split(',').map(Number); if (S.p === p && S.g === g) S.p = S.g = -1; else { S.p = p; S.g = g; } render(); }
  });
  $('#view').addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.alert) { ALERT[t.dataset.alert] = +t.value; saveAlerts(); updateBar(); return; }
    if (t.id && t.id.startsWith('wi-')) { S.wi[t.id.slice(3)] = +t.value; const y = window.scrollY; render(); window.scrollTo(0, y); const n = document.getElementById(t.id); if (n) n.focus(); }
    else if (t.dataset.repl) { CFG.repl[t.dataset.repl] = Math.max(0, +t.value) / 100; const g = t.dataset.repl, y = window.scrollY; render(); window.scrollTo(0, y); const n = document.querySelector(`[data-repl="${g}"]`); if (n) { n.focus(); n.setSelectionRange && 0; } }
  });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawCharts, 120); });
  addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== S.tab) { S.tab = h; render(); } });
  const h0 = location.hash.slice(1); if (TABS.includes(h0)) S.tab = h0;
  render();
  setInterval(() => { if (S.live && D.synthetic) { const ev = liveEvent(D); if (ev.sub !== '' || ev.text !== 'Без змін') { ev.t = Date.now(); S.feed.unshift(ev); S.feed = S.feed.slice(0, 12); S.lastUpdate = Date.now(); const y = window.scrollY, ae = document.activeElement; if (!(ae && ae.tagName === 'INPUT')) { render(); window.scrollTo(0, y); } } } }, 3800);
  setInterval(() => { updateBar(); const f = document.querySelector('.feed'); if (f && S.feed.length) f.outerHTML = feedHtml(); }, 1000);
}
init();

</script>

</html>
